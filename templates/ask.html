<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задать вопрос</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .answer-box {
            background: linear-gradient(135deg, #0f2544, #1a3a5c);
            color: white;
            border-radius: 14px;
            padding: 24px 28px;
            margin-bottom: 28px;
        }
        .answer-box .answer-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .answer-box .answer-text {
            font-size: 15px;
            line-height: 1.7;
        }
        mark {
            background: #fff176;
            color: #0f2544;
            padding: 1px 2px;
            border-radius: 3px;
        }
        .result-card mark {
            background: #fff176;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="back-btn">← Назад</a>
        <h1>Сервис ответов на вопросы</h1>
        <p>Задайте вопрос — система найдёт подходящие статьи законов</p>
    </header>

    <main class="ask-main">
        <div class="ask-form">
            <input type="text" id="question" placeholder="Например: можно ли использовать цифровую подпись для платежей?">
            <button onclick="askQuestion()">Найти ответ</button>
        </div>

        <div id="ask-results"></div>
    </main>

    <script>
        function highlight(text, keywords) {
            if (!keywords || keywords.length === 0) return text;
            const pattern = keywords
                .filter(k => k.length > 3)
                .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .join('|');
            if (!pattern) return text;
            return text.replace(new RegExp(`(${pattern})`, 'gi'), '<mark>$1</mark>');
        }

        function askQuestion() {
            const question = document.getElementById('question').value.trim();
            if (!question) return;

            const resultsDiv = document.getElementById('ask-results');
            resultsDiv.innerHTML = '<p class="loading">Ищем ответ...</p>';

            fetch('/api/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question})
            })
            .then(res => res.json())
            .then(data => {
                const { articles, answer, keywords } = data;

                if (!articles || articles.length === 0) {
                    resultsDiv.innerHTML = '<p class="no-results">Ничего не найдено. Попробуйте другие ключевые слова.</p>';
                    return;
                }

                let html = '';

                // Краткий ответ
                if (answer) {
                    html += `
                        <div class="answer-box">
                            <div class="answer-label">Краткий ответ</div>
                            <div class="answer-text">${highlight(answer, keywords)}</div>
                        </div>
                    `;
                }

                html += `<h2 class="results-title">Найдено ${articles.length} релевантных статей:</h2>`;

                html += articles.map(r => `
                    <div class="result-card" onclick="window.location='/law/${r.law_id}'">
                        <div class="result-header">
                            <span class="law-number">${r.law_number}</span>
                            <span class="result-law-title">${r.law_title}</span>
                        </div>
                        <h4>Статья ${r.number}. ${highlight(r.title, keywords)}</h4>
                        <p>${highlight(r.content, keywords)}</p>
                        <span class="result-link">Перейти к закону →</span>
                    </div>
                `).join('');

                resultsDiv.innerHTML = html;
            });
        }

        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') askQuestion();
        });
    </script>
</body>
</html>
